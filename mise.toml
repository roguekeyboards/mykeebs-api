[tools]
go = "1.27.3"
aws-cli = "2"
aws-sam-cli = "1.171.0"
mockery = "3.9.0"
golangci-lint = "2.15.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
yq = "4.54.1"

[hooks]
postinstall = "go install golang.org/x/tools/gopls@latest"

[tasks.lint]
alias = "l"
description = "Lint Go code and GitHub Actions workflows"
file = "scripts/lint.sh"

[tasks.gen]
alias = "g"
description = "Regenerate mocks, OpenAPI types, and go.mod/go.sum"
file = "scripts/gen.sh"

[tasks.check-generated]
alias = "cg"
description = "Run gen and fail if it changed anything"
file = "scripts/check-generated.sh"

[tasks.test]
alias = "t"
description = "Run unit tests (excludes test/functional)"
file = "scripts/test.sh"

[tasks.build]
alias = "b"
description = "sam build"
file = "scripts/build.sh"

[tasks.bootstrap]
description = "Deploy an account's bootstrap stacks (bootstrap/stacks.yaml): mise run bootstrap <dev|ci|prod> (needs that account's admin credentials)"
file = "scripts/bootstrap.sh"

[tasks.bootstrap-check]
description = "Fail if an account's bootstrap stacks are behind the repo: mise run bootstrap-check <dev|ci|prod> (needs that account's credentials)"
file = "scripts/bootstrap-check.sh"

[tasks.cf-login]
description = "Sign in to Cloudflare for the dns and setup tasks (opens the browser): mise run cf-login"
run = "cf auth login --use-keyring"
tools = { node = "26.13.0", "npm:cf" = "1.0.0-beta.27" }

[tasks.dns]
description = "Point an environment's custom domains at its stack in Cloudflare: mise run dns [env] (needs cf auth login and the env's AWS credentials)"
file = "scripts/dns.sh"
tools = { node = "26.13.0", "npm:cf" = "1.0.0-beta.27" }

[tasks.setup]
description = "One-time setup of an environment's ECR repo + stack: mise run setup [env], env defaults to dev-$(whoami) (requires an authenticated AWS profile)"
file = "scripts/setup.sh"
tools = { node = "26.13.0", "npm:cf" = "1.0.0-beta.27" }

[tasks.deploy]
description = "Deploy the current code to an environment: mise run deploy [env], env defaults to dev-$(whoami) (run setup first)"
file = "scripts/deploy.sh"

[tasks.teardown]
description = "Delete an environment's stack and ECR repo: mise run teardown [env], env defaults to dev-$(whoami); refuses prod"
file = "scripts/teardown.sh"

[tasks.func-setup]
alias = "fs"
description = "Deploy template.yaml to floci + generate local OIDC signing material for functional testing"
file = "scripts/func-setup.sh"

[tasks.func-teardown]
alias = "ft"
description = "Tear down whatever func-setup started"
file = "scripts/func-teardown.sh"

[tasks.func-test]
alias = "fx"
description = "Run functional tests (Ginkgo) against whatever func-setup brought up"
file = "scripts/func-test.sh"

[tasks.client-gen]
alias = "cx"
description = "Generate a TypeScript client from api/openapi.yaml into ts-client/ (dev-only scratch dir, requires Docker)"
file = "scripts/client-gen.sh"

[tasks.migrate-build]
alias = "mb"
description = "Build the mykeebs-migrate dump/restore CLI into bin/ (not covered by sam build)"
file = "scripts/migrate-build.sh"

[tasks.moderation-rejections]
description = "List moderation rejections awaiting review: mise run moderation-rejections [env] [--since Nd] [--all] (needs an admin AWS profile)"
run = "scripts/moderation.sh rejections"

[tasks.moderation-view]
description = "Open an image in the browser, whatever its status: mise run moderation-view [env] <key> (needs an admin AWS profile)"
run = "scripts/moderation.sh view"

[tasks.moderation-uphold]
description = "Record that a rejection was reviewed and stands: mise run moderation-uphold [env] <key> (needs an admin AWS profile)"
run = "scripts/moderation.sh uphold"

[tasks.moderation-approve]
description = "Override a rejection: mise run moderation-approve [env] <key> (needs an admin AWS profile)"
run = "scripts/moderation.sh approve"

[tasks.moderation-reject]
description = "Take down an approved image: mise run moderation-reject [env] <key> [reason] (needs an admin AWS profile)"
run = "scripts/moderation.sh reject"

[tasks.moderation-pause]
description = "Stop moderating new uploads (they stay pending): mise run moderation-pause [env] (needs an admin AWS profile)"
run = "scripts/moderation.sh pause"

[tasks.moderation-resume]
description = "Start moderating again and report the dead-letter queue's size: mise run moderation-resume [env] (needs an admin AWS profile)"
run = "scripts/moderation.sh resume"

[tasks.moderation-dlq]
description = "List events the moderation function failed on, without removing them: mise run moderation-dlq [env] (needs an admin AWS profile)"
run = "scripts/moderation.sh dlq"

[tasks.moderation-redrive]
description = "Rerun failed moderation events: mise run moderation-redrive [env] [--key K] (needs an admin AWS profile)"
run = "scripts/moderation.sh redrive"
