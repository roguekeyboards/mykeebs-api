name: Deploy Prod

# Every release deploys its tag. There's no manual trigger: a bad release is
# fixed forward with another release, and a deploy that failed for a
# transient reason is retried with "Re-run failed jobs" on its run.
on:
  release:
    types: [published]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  API_BASE_URL: https://api.mykeebs.info

jobs:
  deploy:
    name: Deploy
    # Native arm64, matching the functions' architecture (see ci.yml).
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Configure AWS credentials (prod account, OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: deploy-prod-${{ github.ref_name }}

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Check bootstrap stacks are up to date
        run: mise run bootstrap-check prod

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Deploy
        run: mise run deploy prod

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --output /dev/null "$API_BASE_URL/v1/lookups"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$API_BASE_URL/.well-known/oauth-protected-resource" \
            | grep --fixed-strings --quiet '"https://auth.mykeebs.info"'
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --output /dev/null "$API_BASE_URL/authorize"
