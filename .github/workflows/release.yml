name: Release

on:
  push:
    branches: [main]
  # Recovers a push GitHub never delivered (#545's merge started no runs):
  # gh workflow run release.yml. semantic-release releases every commit since
  # the last tag, so a late run loses nothing.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # A release created with the default GITHUB_TOKEN doesn't trigger
      # other workflows (GitHub's anti-loop restriction on Actions-bot
      # events) - publish-clients.yml's `on: release: published` would
      # never fire. An App token isn't subject to that restriction. Must
      # run before checkout so checkout's own git credentials (used by
      # semantic-release's `git push` of the version tag) are the App
      # token's too, not the default GITHUB_TOKEN's.
      - name: Generate App Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.TOKEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOKEN_APP_PK }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
