#:tombi schema.strict = false
version = 0.1

# One section per environment, deployed with mise run setup|deploy|teardown
# <env> (see CONTRIBUTING.md). Every parameter an environment needs lives in
# its section: passing --parameter-overrides on the command line would
# replace parameter_overrides here wholesale, not merge with it.

[default.global.parameters]
region = "us-east-2"

[dev-jay.deploy.parameters]
stack_name = "mykeebs-api-dev-jay"
s3_bucket = "mykeebs-sam-artifacts-992234857260"
# Both functions push to the one repo; SAM tags each image with its
# function's name, so they don't collide.
image_repositories = [
  "ApiFunction=992234857260.dkr.ecr.us-east-2.amazonaws.com/mykeebs-api-dev-jay",
  "ModerateFunction=992234857260.dkr.ecr.us-east-2.amazonaws.com/mykeebs-api-dev-jay",
]
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = """\
  OidcIssuerBaseUrl=https://auth.jay.mykeebs.dev \
  OidcAudience=project-test-e811f2fd-9992-4bc8-ba6a-ed578b7f5411 \
  IdpConsentPublicToken=public-token-test-ecb1c2b7-2170-4a87-947c-b6dcc6ae3047 \
  CorsAllowOrigins=http://localhost:5173,https://jay.mykeebs.dev \
  CustomDomainName=jay.api.mykeebs.dev \
  CustomDomainCertificateArn=arn:aws:acm:us-east-2:992234857260:certificate/9779ae75-a23b-4a33-8619-e26b7125f237 \
  ImagesDomainName=jay.images.mykeebs.dev \
  ImagesDomainCertificateArn=arn:aws:acm:us-east-1:992234857260:certificate/88553c3c-cb56-4fa1-a8cf-15fd5ee48a32 \
  AlarmEmail=mykeebs-alerts-dev@mykeebs.com\
  """

[prod.deploy.parameters]
stack_name = "mykeebs-api-prod"
s3_bucket = "mykeebs-sam-artifacts-416860882648"
image_repositories = [
  "ApiFunction=416860882648.dkr.ecr.us-east-2.amazonaws.com/mykeebs-api-prod",
  "ModerateFunction=416860882648.dkr.ecr.us-east-2.amazonaws.com/mykeebs-api-prod",
]
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = """\
  OidcIssuerBaseUrl=https://auth.mykeebs.info \
  OidcAudience=project-live-35306870-482a-497d-b0b8-3a884a3071e1 \
  IdpConsentPublicToken=public-token-live-a617925c-c858-4b41-bc96-d4c869e3e3f8 \
  CorsAllowOrigins=https://mykeebs.info \
  CustomDomainName=api.mykeebs.info \
  CustomDomainCertificateArn=arn:aws:acm:us-east-2:416860882648:certificate/f5ba7297-6386-4221-b101-4687ef89f0d0 \
  ImagesDomainName=images.mykeebs.info \
  ImagesDomainCertificateArn=arn:aws:acm:us-east-1:416860882648:certificate/d883cae9-b0f0-4dd7-92a1-29b79d86222e \
  ProtectData=true \
  ThrottleRateLimit=5 \
  ThrottleBurstLimit=50 \
  ApiReservedConcurrency=15 \
  AlarmEmail=mykeebs-alerts-prd@mykeebs.com\
  """

# CI deploys per-PR stacks into the separate mykeebs-api-ci account (475976462467),
# selected via `sam build/deploy --config-env ci`. stack_name,
# image_repositories and parameter_overrides are deliberately NOT set here -
# all are supplied per-run on the command line (--stack-name mykeebs-api-pr-<N>,
# computed by .github/actions/mykeebs-api-pr-stack).
[ci.deploy.parameters]
s3_bucket = "mykeebs-sam-artifacts-475976462467"
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
