AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bootstrap (every account) - the account's cost-budget tripwire. A budget
  watches the whole account's spend, so there's one per account rather than
  one per stack. This project is designed to run at effectively $0 on AWS
  free-tier usage, so a real bill in any account is itself the alarm.

Parameters:
  BudgetLimitUsd:
    Type: Number
    Default: 10
    Description: Monthly budget limit in USD.
  AlertEmail:
    Type: String
    Description: Email address notified at 80% and 100% of the budget.

Resources:
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
